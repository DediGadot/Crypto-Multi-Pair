# Example Strategy Configuration File
# This file demonstrates how to configure trading strategies for the crypto trading system

strategies:
  # Moving Average Crossover Strategy with default settings
  - name: "MA_Cross_10_20"
    class: "MovingAverageCrossover"
    enabled: true
    description: "Fast MA crossover strategy with 10/20 periods"
    tags: ["momentum", "short_term"]
    parameters:
      fast_period: 10
      slow_period: 20
      signal_threshold: 0.75
      ma_type: "SMA"

  # Moving Average Crossover Strategy with longer periods
  - name: "MA_Cross_50_200"
    class: "MovingAverageCrossover"
    enabled: true
    description: "Golden cross strategy with 50/200 periods"
    tags: ["momentum", "long_term"]
    parameters:
      fast_period: 50
      slow_period: 200
      signal_threshold: 0.8
      ma_type: "SMA"

  # EMA-based strategy
  - name: "EMA_Cross_12_26"
    class: "MovingAverageCrossover"
    enabled: true
    description: "EMA crossover similar to MACD signal line"
    tags: ["momentum", "ema"]
    parameters:
      fast_period: 12
      slow_period: 26
      signal_threshold: 0.7
      ma_type: "EMA"

  # Disabled strategy (not loaded by default)
  - name: "MA_Cross_Experimental"
    class: "MovingAverageCrossover"
    enabled: false
    description: "Experimental settings for testing"
    tags: ["experimental"]
    parameters:
      fast_period: 5
      slow_period: 15
      signal_threshold: 0.6
      ma_type: "SMA"

  # --- SOTA 2025 examples ---

  - name: "MultiTimeframe_Default"
    class: "MultiTimeframeConfluence"
    enabled: true
    description: "Signals only when 1h/4h/1d trends align"
    tags: ["sota_2025", "trend_following"]
    parameters:
      min_confluence: 4
      ema_fast: 20
      ema_slow: 50

  - name: "OnChain_BTC"
    class: "OnChainAnalytics"
    enabled: true
    description: "Glassnode-style on-chain capitulation signals"
    tags: ["onchain", "sentiment"]
    parameters:
      mvrv_buy: 0.5
      mvrv_sell: 6.0
      sopr_buy: 1.0
      sopr_sell: 1.05

  - name: "Regime_Adaptive_Core"
    class: "VolatilityRegimeAdaptive"
    enabled: true
    description: "Switch between trend and mean-reversion by regime"
    tags: ["meta", "regime"]
    parameters:
      regime_map:
        mean_reverting: "RSI_MeanReversion"
        trending: "Supertrend_ATR"
        volatile: "OnChainAnalytics"

  - name: "Dynamic_Ensemble_Core"
    class: "DynamicEnsemble"
    enabled: true
    description: "Meta-ensemble weighting based on recent Sharpe"
    tags: ["meta", "ensemble"]
    parameters:
      strategies:
        - "MultiTimeframeConfluence"
        - "OnChainAnalytics"
        - "Supertrend_ATR"
        - "RSI_MeanReversion"
      confidence_threshold: 0.1

  - name: "Transformer_GRU_BTC"
    class: "TransformerGRUPredictor"
    enabled: false
    description: "Requires pretrained Transformer-GRU checkpoint"
    tags: ["ml", "transformer"]
    parameters:
      model_path: "models/transformer_gru.ckpt"
      buy_threshold: 0.02
      sell_threshold: 0.02

  - name: "DDQN_Feature_Selected"
    class: "DDQNFeatureSelected"
    enabled: false
    description: "Uses DDQN policy with XGBoost-selected features"
    tags: ["rl", "ddqn"]
    parameters:
      model_path: "models/ddqn_policy.zip"
      feature_file: "models/ddqn_features.json"

  - name: "Sentiment_Fusion"
    class: "MultiModalSentimentFusion"
    enabled: true
    description: "Blend sentiment + on-chain + price momentum"
    tags: ["sentiment", "fusion"]
    parameters:
      buy_threshold: 0.25
      sell_threshold: -0.2

  - name: "OrderFlow_Imbalance"
    class: "OrderFlowImbalance"
    enabled: false
    description: "Requires L2 order book streaming via ccxt.pro"
    tags: ["microstructure", "orderflow"]
    parameters:
      delta_threshold: 100.0
      imbalance_threshold: 0.3
      vpin_threshold: 0.6
